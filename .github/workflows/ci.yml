name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: monitoring-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: End-to-end verification (22 checks)
        run: python3 test_system.py
      - name: Dashboard verification (7 checks)
        run: python3 test_dashboard.py
      - name: Protocol self-test
        run: python3 snmp_lite.py
